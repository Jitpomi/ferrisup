[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2024"
description = "A Cloudflare Workers API built with Rust and WebAssembly"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
# Worker crate and dependencies
worker = "0.8.5"

# Supporting libraries
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
console_error_panic_hook = "0.1.7"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
