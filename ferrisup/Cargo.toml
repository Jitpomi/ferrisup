[package]
name = "ferrisup"
version = "0.2.6"
edition = "2024"
description = "Inspect, create, and evolve coherent Rust project foundations"
authors = ["Jitpomi <info@jitpomi.com>"]
license = "MIT"
repository = "https://github.com/Jitpomi/ferrisup"
documentation = "https://github.com/Jitpomi/ferrisup#readme"
readme = "README.md"
homepage = "https://ferrisup.jitpomi.com"
keywords = ["cli", "bootstrap", "template", "project", "generator"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata]

[package.metadata.ferrisup]
component_type = "binary"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = { workspace = true }
thiserror = "2.0"
handlebars = "6.4"
colored = { workspace = true }
dialoguer = "0.12.0"
indicatif = "0.18.6"
console = "0.16"
fs_extra = "1.3"
walkdir = { workspace = true }
log = "0.4"
env_logger = "0.11"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
lazy_static = "1.5.0"
tempfile = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
dirs = "6.0"
chrono = "0.4"
image = "0.25"
term_size = "0.3"

[dependencies.ferrisup-common]
workspace = true

[features]
default = []
workspace_test = []
