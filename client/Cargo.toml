[package]
name = "client"
version = "0.2.5"
authors = ["jermsam <ssali@jitpomi.com>"]
edition = "2024"
description = "FerrisUp website client built with Dioxus"
license = "MIT"
repository = "https://github.com/Jitpomi/ferrisup"
homepage = "https://ferrisup.jitpomi.com"
keywords = ["ferrisup", "website", "dioxus", "rust", "web"]
categories = ["web-programming"]
publish = false

[package.metadata]

[package.metadata.ferrisup]
component_type = "client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
